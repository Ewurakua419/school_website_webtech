
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Page</title>

    <!-- Link your existing CSS stylesheet here -->
    <link rel="stylesheet" href="YOUR-STYLESHEET.css">
</head>
<body>

    <header>
        <h1>Student Admission</h1>
        <p>Complete the form below to apply for admission.</p>
    </header>

    <main>
        <form action="#" method="POST">

            <h2>Personal Information</h2>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <h2>Contact Information</h2>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="address">Residential Address:</label>
            <textarea id="address" name="address" rows="3"></textarea>

            <h2>Academic Information</h2>

            <label for="previous-school">Previous School:</label>
            <input type="text" id="previous-school" name="previous-school" required>

            <label for="programme">Programme of Interest:</label>
            <select id="programme" name="programme" required>
                <option value="">Select Programme</option>
                <option value="computer-science">Computer Science</option>
                <option value="business-administration">Business Administration</option>
                <option value="engineering">Engineering</option>
                <option value="other">Other</option>
            </select>

            <label for="results">Upload Academic Results:</label>
            <input type="file" id="results" name="results">

            <button type="submit">Submit Application</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Student Admission Portal</p>
    </footer>

</body>
</html>
